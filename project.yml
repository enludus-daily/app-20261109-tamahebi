# XcodeGen の spec（https://github.com/yonaskolb/XcodeGen）。.xcodeproj はコミットせず、CI と手元で生成する。
# 名前と Bundle ID は scripts/new-app.sh が書き換える（テンプレートの名前・Bundle ID の文字列を全部置き換える）。
name: Tamahebi
options:
  developmentLanguage: ja
  deploymentTarget:
    iOS: "18.0"
  createIntermediateGroups: true
settings:
  base:
    MARKETING_VERSION: "1.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "6.0"
    ENABLE_USER_SCRIPT_SANDBOXING: YES
    DEAD_CODE_STRIPPING: YES
# 広告（AdMob のリワード広告だけ）。本人の許可 2026-11-10。版は固定する
packages:
  GoogleMobileAds:
    url: https://github.com/googleads/swift-package-manager-google-mobile-ads
    exactVersion: 13.10.0
  GoogleUserMessagingPlatform:
    url: https://github.com/googleads/swift-package-manager-google-user-messaging-platform
    exactVersion: 3.0.0
targets:
  Tamahebi:
    type: application
    platform: iOS
    dependencies:
      - package: GoogleMobileAds
      - package: GoogleUserMessagingPlatform
    sources:
      - path: App/Sources
      - path: App/Resources
    info:
      path: App/Info.plist
      properties:
        CFBundleDisplayName: "タマヘビ"
        CFBundleDevelopmentRegion: ja
        CFBundleLocalizations:
          - ja
          - en
        CFBundleShortVersionString: $(MARKETING_VERSION)
        CFBundleVersion: $(CURRENT_PROJECT_VERSION)
        # 標準の HTTPS 以外の暗号を使わない前提。使うなら本人に戻す（輸出規制の申告が変わる）
        ITSAppUsesNonExemptEncryption: false
        LSRequiresIPhoneOS: true
        UILaunchScreen: {}
        UIApplicationSceneManifest:
          UIApplicationSupportsMultipleScenes: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
        # AdMob のアプリ ID（秘密ではない。アプリの中に入る値）
        GADApplicationIdentifier: ca-app-pub-1806737602764042~2150188942
        NSUserTrackingUsageDescription: "あなたに合った広告を出すために使います。許可しなくても、広告の数は変わらず遊べます。"
        SKAdNetworkItems:
          - SKAdNetworkIdentifier: cstr6suwn9.skadnetwork
    # 進み具合を iCloud（キーと値）にも置く。削除して入れ直しても、同じ Apple ID なら戻る（本人の希望 2026-11-13）
    entitlements:
      path: App/Tamahebi.entitlements
      properties:
        com.apple.developer.ubiquity-kvstore-identifier: $(TeamIdentifierPrefix)$(CFBundleIdentifier)
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.006
        PRODUCT_NAME: Tamahebi
        # iPhone だけ（iPad 対応にすると iPad のスクリーンショットも提出に要る）
        TARGETED_DEVICE_FAMILY: "1"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_STYLE: Automatic
  TamahebiTests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: Tests
    dependencies:
      - target: Tamahebi
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.enludus.daily.006.tests
        GENERATE_INFOPLIST_FILE: YES
schemes:
  Tamahebi:
    build:
      targets:
        Tamahebi: all
        TamahebiTests: [test]
    test:
      gatherCoverageData: true
      targets:
        - TamahebiTests
