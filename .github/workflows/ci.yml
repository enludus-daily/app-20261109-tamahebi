name: CI
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true
jobs:
  ci:
    uses: enludus-daily/daily-actions/.github/workflows/ios-ci.yml@ccf013987db23185af0d99c471070a8931f45d20 # daily-actions 2026-11-10-withdraw
    with:
      actions-sha: ccf013987db23185af0d99c471070a8931f45d20
      scheme: Tamahebi
      # iPhone Duo の全画面の表示には Xcode 27.1（iOS 27.1 SDK）が要る（Apple Tech Talk「Prepare your app for iPhone Duo」）。
      # xcode-27 ランナーは GitHub で Preview 扱い（actions/runner-images #14404）。
      runs-on: xcode-27
      xcode-version: "27.1"
      test-destination: "platform=iOS Simulator,name=iPhone Duo,OS=27.1"
      screenshot-device: iPhone Duo
      # 撮る画面（アプリが起動引数 -screenshotScene <名前> で開く画面。@dark でダークモード）。手順書 9.5
      screenshot-scenes: tutorial launch worlds stages game hint result collection shop tutorial@en home@en worlds@en stages@en game@en hint@en result@en collection@en capsule@en shop@en daily@en
      guard-disabled: ${{ vars.DAILY_GUARD_DISABLED == 'true' && 'true' || 'false' }}
